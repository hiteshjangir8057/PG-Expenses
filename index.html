<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PG Manager LIVE PRO v27</title>
<style>
:root{
 --bg:#f3f4f6;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
 --primary:#2563eb;--danger:#dc2626;--green:#16a34a;--orange:#ea580c;--nav:#111827;
}
.theme-dark { --bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155; }
.theme-night { --bg:#000000;--card:#111111;--text:#e2e8f0;--muted:#71717a;--line:#262626; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:0.3s;overflow-x:hidden}
button{cursor:pointer;border:0;transition:0.1s;outline:none;font-weight:600}

/* Sidebar & Nav */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--nav);color:#fff;padding:10px;z-index:100;display:block}
.brand{font-size:18px;font-weight:900;margin-bottom:15px;color:#3b82f6;text-align:center}
.nav-btn{width:100%;text-align:left;padding:8px;background:transparent;color:#94a3b8;border-radius:8px;margin-bottom:2px;font-size:13px;display:flex;align-items:center;gap:6px}
.nav-btn.active{background:#2563eb;color:#fff}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:50px;background:var(--card);display:none;justify-content:space-around;align-items:center;border-top:1px solid var(--line);z-index:1000}
.mobile-btn{background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mobile-btn.active{color:var(--primary);font-weight:bold}

.main{margin-left:200px;padding:4px;padding-bottom:70px;min-height:100vh}
.page{display:none} .page.active{display:block; animation: fadeIn 0.2s;}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.top-header{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px 0}
.sync-pill{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:4px}
.dot { width:8px; height:8px; border-radius:50%; background:#16a34a; }
.dot.syncing { background:#ea580c; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* UI Cards */
.card{background:var(--card);border-radius:10px;padding:8px;border:1px solid var(--line);margin-bottom:4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:3px;margin-bottom:4px}
.stat-card{background:var(--card);border-radius:8px;padding:6px;border:1px solid var(--line);text-align:center}
.label{color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}
.val{font-size:14px;font-weight:900}

.user-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:4px}
.user-card{background:var(--card);padding:8px;border-radius:10px;border:1px solid var(--line);text-align:center;cursor:pointer;border-bottom:3px solid var(--primary)}

.table-wrap{background:var(--card);border-radius:10px;border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:rgba(0,0,0,0.03);padding:6px;text-align:left;font-size:10px;color:var(--muted);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);font-size:12px}

.form-control{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;margin-bottom:4px;outline:none}
.btn-primary{background:var(--primary);color:#fff;padding:8px;border-radius:8px;font-weight:bold;width:100%}
.btn-sec{background:rgba(37,99,235,0.1);color:var(--primary);padding:4px 8px;border-radius:6px;font-size:11px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:2000;padding:10px}
.modal.show{display:flex}
.modal-content{background:var(--card);width:100%;max-width:980px;border-radius:12px;padding:12px;max-height:98vh;overflow-y:auto}

.fab{position:fixed;bottom:65px;right:15px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:white;font-size:24px;box-shadow:0 8px 16px rgba(0,0,0,0.2);z-index:900;display:flex;align-items:center;justify-content:center}

@media(max-width:900px){
 .sidebar{display:none} .main{margin-left:0;padding:4px} .bottom-nav{display:flex}
 .stat-grid{grid-template-columns: 1fr 1fr}
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="brand">💰 PG LIVE PRO</div>
    <nav>
        <button class="nav-btn" data-id="dashboard" onclick="showPage('dashboard')">🏠 Dashboard</button>
        <button class="nav-btn" data-id="transactions" onclick="showPage('transactions')">📋 All Logs</button>
        <button class="nav-btn" data-id="categories" onclick="showPage('categories')">🗂️ Cats</button>
        <button class="nav-btn" data-id="settings" onclick="showPage('settings')">⚙️ Settings</button>
    </nav>
</div>

<div class="bottom-nav">
    <button class="mobile-btn" data-id="dashboard" onclick="showPage('dashboard')">🏠<br>Home</button>
    <button class="mobile-btn" data-id="transactions" onclick="showPage('transactions')">📋<br>Logs</button>
    <button class="mobile-btn" data-id="categories" onclick="showPage('categories')">🗂️<br>Cats</button>
    <button class="mobile-btn" data-id="settings" onclick="showPage('settings')">⚙️<br>Sync</button>
</div>

<main class="main">
    <div class="top-header">
        <h4 id="titleText" style="margin:0">Dashboard</h4>
        <div class="sync-pill">
            <div id="syncDot" class="dot"></div>
            <span id="syncText">Live</span>
        </div>
    </div>

    <!-- GLOBAL FILTER & THEME -->
    <div class="card" style="padding:4px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap">
            <div style="display:flex;gap:3px">
                <button class="btn-sec" onclick="setTheme('light')">☀️</button>
                <button class="btn-sec" onclick="setTheme('dark')">🌙</button>
                <button class="btn-sec" onclick="setTheme('night')">🌌</button>
            </div>
            <select id="timeFilter" class="form-control" style="margin:0;width:120px;padding:2px" onchange="toggleCustomRange(); renderDashboard()">
                <option value="today">Today</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year" selected>Year</option>
                <option value="custom">📅 Custom</option>
            </select>
        </div>
        <div id="customPicker" style="display:none; margin-top:6px; border-top:1px solid var(--line); padding-top:6px">
            <div style="display:flex; gap:4px">
                <input type="date" id="startRange" class="form-control" style="margin:0">
                <input type="date" id="endRange" class="form-control" style="margin:0">
                <button class="btn-sec" onclick="renderDashboard()" style="background:var(--primary); color:white">Apply</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="page">
        <div class="stat-grid">
            <div class="stat-card" style="color:var(--green)"><div class="label">IN</div><div id="totalInc" class="val">₹0</div></div>
            <div class="stat-card" style="color:var(--danger)"><div class="label">EXP</div><div id="totalExp" class="val">₹0</div></div>
            <div class="stat-card" style="color:var(--orange)"><div class="label">PAID</div><div id="totalPaid" class="val">₹0</div></div>
            <div class="stat-card" style="color:var(--primary)"><div class="label">DUE</div><div id="totalBal" class="val">₹0</div></div>
        </div>
        <div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <h5 style="margin:0">Residents Summary</h5>
                <button class="btn-sec" onclick="openBulkModal(null)">🧾 Global Bulk</button>
            </div>
            <div id="userGrid" class="user-grid"></div>
        </div>
        <div class="card">
            <h5 style="margin:0 0 5px 0">Category Insights</h5>
            <div id="catInsights"></div>
        </div>
    </div>

    <!-- TRANSACTIONS -->
    <div id="transactions" class="page">
        <div class="card">
            <input type="text" id="mainSearch" class="form-control" placeholder="Search logs..." oninput="renderTransactions()">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Date</th><th>Item</th><th>Resident</th><th>Amt</th><th>Type</th><th>Cat</th></tr></thead>
                    <tbody id="txBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- USER DETAIL -->
    <div id="userDetail" class="page">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <h3 id="udName" style="margin:0;font-size:16px">User</h3>
                <div style="display:flex;gap:4px">
                    <button class="btn-sec" onclick="openBulkModal(activeUserId)">🧾 List Entry</button>
                    <button class="btn-sec" onclick="window.history.back()">Back</button>
                </div>
            </div>
            <div id="udStats" style="display:flex;gap:15px;margin-bottom:10px"></div>
            <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:4px">
                <input type="text" id="udSearch" class="form-control" placeholder="Search..." oninput="renderUserDetail(activeUserId)">
                <select id="udTypeFilter" class="form-control" onchange="renderUserDetail(activeUserId)"><option value="">All Types</option><option>Expense</option><option>Paid</option><option>Income</option></select>
                <select id="udCatFilter" class="form-control" onchange="renderUserDetail(activeUserId)"><option value="">All Cats</option></select>
            </div>
        </div>
        <div class="table-wrap"><table><tbody id="udBody"></tbody></table></div>
    </div>

    <div id="categories" class="page">
        <div class="card">
            <button class="btn-primary" onclick="addCategory()">＋ Add Category</button>
            <div id="catList" style="margin-top:10px"></div>
        </div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="page">
        <div class="card">
            <h5>Engine Status</h5>
            <button class="btn-primary" onclick="githubPull()">🔄 Force Sync Now</button>
            <button onclick="secureReset()" style="width:100%;margin-top:40px;color:red;background:none;font-size:12px;border:1px solid #ff000033;border-radius:10px;padding:10px">D</button>
        </div>
    </div>

    <button class="fab" onclick="openEntryModal()">＋</button>
</main>

<!-- MODALS -->
<div id="bulkModal" class="modal">
    <div class="modal-content">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <h4 style="margin:0">Bulk Entry</h4>
            <button class="btn-sec" onclick="addBulkRow()">＋ Row</button>
        </div>
        <div style="overflow-x:auto;margin-bottom:10px">
            <table style="width:100%;min-width:950px">
                <thead><tr><th>Date</th><th>Item</th><th>Category</th><th>User</th><th>Type</th><th>Amt</th><th>Remark</th><th></th></tr></thead>
                <tbody id="bulkBody"></tbody>
            </table>
        </div>
        <button class="btn-primary" onclick="saveBulk()">Save All Instant</button>
        <button onclick="window.history.back()" style="width:100%;background:none;margin-top:8px;color:var(--muted);font-size:12px">Cancel</button>
    </div>
</div>

<div id="entryModal" class="modal">
    <div class="modal-content" style="max-width:350px">
        <h4 style="margin:0 0 10px 0">New Entry</h4>
        <input type="text" id="eItem" class="form-control" placeholder="Item Name">
        <input type="number" id="eAmt" class="form-control" placeholder="Amount">
        <select id="eType" class="form-control"><option>Expense</option><option>Paid</option><option>Income</option></select>
        <select id="eUser" class="form-control"></select>
        <select id="eCat" class="form-control"></select>
        <input type="text" id="eNote" class="form-control" placeholder="Remark/Note">
        <input type="date" id="eDate" class="form-control">
        <button class="btn-primary" onclick="saveEntry()">Save Instant</button>
        <button onclick="window.history.back()" style="width:100%;background:none;margin-top:8px;color:var(--muted)">Cancel</button>
    </div>
</div>

<script>
// --- CONFIG ---
const GH = {
    owner: 'hiteshjangir8057', repo: 'PG-Expenses', path: 'pg-money-data.json',
    token: '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'
};
const KEY = 'pg_money_v27_final';
const RESET_PWD = '9829848057';

let state = {
    users: [{id:'1', name:'Hitesh'}, {id:'2', name:'Dinesh'}, {id:'3', name:'Satish'}],
    entries: [],
    categories: ['Food', 'Rent', 'Grocery', 'Electricity', 'Water', 'Internet', 'Salary']
};
let currentSHA = null;
let activeUserId = null;
const $ = id => document.getElementById(id);

// --- NAVIGATION ---
window.onpopstate = (e) => {
    const modals = document.querySelectorAll('.modal.show');
    if (modals.length > 0) { modals.forEach(m => m.classList.remove('show')); return; }
    if (e.state && e.state.page) renderPage(e.state.page, e.state.uid);
    else renderPage('dashboard');
};
function showPage(p, uid = null) { window.history.pushState({page: p, uid: uid}, "", "#" + p); renderPage(p, uid); }
function renderPage(p, uid = null) {
    activeUserId = uid;
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
    $(p).classList.add('active');
    document.querySelectorAll('.nav-btn, .mobile-btn').forEach(b => b.classList.toggle('active', b.dataset.id === p));
    if(p === 'dashboard') renderDashboard();
    if(p === 'userDetail' && uid) renderUserDetail(uid);
    if(p === 'transactions') renderTransactions();
    window.scrollTo(0,0);
}

// --- SYNC ---
async function githubPull() {
    updateSyncUI('busy');
    try {
        const res = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`, { 
            headers: { 'Authorization': `token ${GH.token}` }, cache: "no-store" 
        });
        if(res.ok) {
            const data = await res.json();
            if(data.sha === currentSHA) { updateSyncUI('online'); return; }
            currentSHA = data.sha;
            state = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            localStorage.setItem(KEY, JSON.stringify(state));
            renderAll();
            updateSyncUI('online');
        }
    } catch (e) { updateSyncUI('offline'); }
}
async function githubPush() {
    updateSyncUI('busy');
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
        const getRes = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`, { 
            headers: { 'Authorization': `token ${GH.token}` } 
        });
        if(getRes.ok) currentSHA = (await getRes.json()).sha;
        const res = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`, {
            method: 'PUT', headers: { 'Authorization': `token ${GH.token}` },
            body: JSON.stringify({ message: 'LiveSync V27', content, sha: currentSHA || undefined })
        });
        if(res.ok) { currentSHA = (await res.json()).content.sha; updateSyncUI('online'); }
    } catch (e) { updateSyncUI('offline'); }
}
function updateSyncUI(s) {
    const dot = $('syncDot');
    dot.className = s === 'busy' ? 'dot syncing' : 'dot';
    dot.style.background = s === 'online' ? '#16a34a' : (s === 'busy' ? '#ea580c' : '#dc2626');
    $('syncText').textContent = s === 'online' ? 'Live' : (s === 'busy' ? 'Syncing' : 'Offline');
}

// --- CORE ---
function getFilteredData() {
    const filter = $('timeFilter').value;
    const now = new Date(); let start = new Date(0); 
    if (filter === 'today') { start = new Date(); start.setHours(0,0,0,0); }
    else if (filter === 'week') { start = new Date(); start.setDate(now.getDate() - now.getDay()); }
    else if (filter === 'month') { start = new Date(now.getFullYear(), now.getMonth(), 1); }
    else if (filter === 'year') { start = new Date(now.getFullYear(), 0, 1); }
    else if (filter === 'custom') {
        const s = $('startRange').value, e = $('endRange').value;
        if(s && e) return state.entries.filter(ent => ent.date >= s && ent.date <= e);
    }
    return state.entries.filter(e => e.date >= start.toISOString().split('T')[0]);
}

function renderDashboard() {
    const data = getFilteredData();
    const inc = data.filter(e => e.type === 'Income').reduce((a,b) => a + b.amount, 0);
    const exp = data.filter(e => e.type === 'Expense').reduce((a,b) => a + b.amount, 0);
    const paid = data.filter(e => e.type === 'Paid').reduce((a,b) => a + b.amount, 0);
    $('totalInc').textContent = '₹' + inc; $('totalExp').textContent = '₹' + exp;
    $('totalPaid').textContent = '₹' + paid; $('totalBal').textContent = '₹' + (exp - paid);

    $('userGrid').innerHTML = state.users.map(u => {
        const uExp = data.filter(e => e.personId === u.id && e.type === 'Expense').reduce((a,b) => a + b.amount, 0);
        return `<div class="user-card" onclick="showPage('userDetail', '${u.id}')"><b>${u.name}</b><br><small style="color:red">₹${uExp}</small></div>`;
    }).join('');

    const cats = {};
    data.filter(e => e.type === 'Expense').forEach(e => { let c = e.category || 'Other'; cats[c] = (cats[c] || 0) + e.amount; });
    $('catInsights').innerHTML = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line);font-size:12px"><span>${k}</span><b>₹${v}</b></div>`).join('') || 'No data';
}

function renderUserDetail(uid) {
    const user = state.users.find(u => u.id === uid);
    $('udName').textContent = user.name;
    const catFilt = $('udCatFilter');
    if(catFilt.options.length <= 1) catFilt.innerHTML = '<option value="">All Cats</option>' + state.categories.map(c=>`<option value="${c}">${c}</option>`).join('');

    const sVal = $('udSearch').value.toLowerCase(), tFilt = $('udTypeFilter').value, cFilt = $('udCatFilter').value;
    const all = state.entries.filter(e => e.personId === uid);
    const filtered = all.filter(e => {
        return (e.item.toLowerCase().includes(sVal) || (e.note && e.note.toLowerCase().includes(sVal))) && (!tFilt || e.type === tFilt) && (!cFilt || e.category === cFilt);
    }).reverse();

    $('udStats').innerHTML = `<div style="color:red"><small>Exp</small><br><b>₹${all.filter(e=>e.type==='Expense').reduce((a,b)=>a+b.amount,0)}</b></div><div style="color:orange;margin-left:15px"><small>Paid</small><br><b>₹${all.filter(e=>e.type==='Paid').reduce((a,b)=>a+b.amount,0)}</b></div>`;
    $('udBody').innerHTML = filtered.map(e => `<tr><td>${e.date}</td><td><b>${e.item}</b><br><small>${e.note||''}</small></td><td>${e.category}</td><td>${e.type}</td><td style="font-weight:bold">₹${e.amount}</td><td><button onclick="deleteTx(${e.id})" style="background:none">🗑️</button></td></tr>`).join('');
}

function renderTransactions() {
    const q = $('mainSearch').value.toLowerCase();
    const data = state.entries.filter(e => e.item.toLowerCase().includes(q) || (e.note && e.note.toLowerCase().includes(q))).reverse();
    $('txBody').innerHTML = data.map(e => `<tr><td>${e.date}</td><td>${e.item}</td><td>${state.users.find(u=>u.id===e.personId)?.name}</td><td>₹${e.amount}</td><td>${e.type}</td><td>${e.category}</td></tr>`).join('');
}

// --- ACTIONS ---
function saveEntry() {
    const amt = Number($('eAmt').value); if(!amt || !$('eItem').value) return alert('Data missing');
    state.entries.push({ id: Date.now(), date: $('eDate').value || new Date().toISOString().split('T')[0], item: $('eItem').value, amount: amt, personId: $('eUser').value, category: $('eCat').value || 'Other', type: $('eType').value, note: $('eNote').value || '' });
    renderAll(); window.history.back(); githubPush();
}
function saveBulk() {
    const rows = document.querySelectorAll('#bulkBody tr'); let added = false;
    rows.forEach(r => {
        const item = r.querySelector('.b-item').value, amt = Number(r.querySelector('.b-amt').value);
        if(item && amt) {
            state.entries.push({ id: Date.now()+Math.random(), date: r.querySelector('.b-date').value, item, amount: amt, category: r.querySelector('.b-cat').value, personId: r.querySelector('.b-user').value, type: r.querySelector('.b-type').value, note: r.querySelector('.b-note').value || '' });
            added = true;
        }
    });
    if(added) { renderAll(); window.history.back(); githubPush(); }
}
function addBulkRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="date" class="b-date" value="${new Date().toISOString().split('T')[0]}" style="width:105px;font-size:11px"></td>
        <td><input type="text" class="b-item" placeholder="Item" style="width:100%;padding:4px"></td>
        <td><select class="b-cat" style="width:100%">${state.categories.map(c=>`<option>${c}</option>`).join('')}</select></td>
        <td><select class="b-user" style="width:100%">${state.users.map(u=>`<option value="${u.id}" ${u.id===activeUserId?'selected':''}>${u.name}</option>`).join('')}</select></td>
        <td><select class="b-type"><option>Expense</option><option>Paid</option><option>Income</option></select></td>
        <td><input type="number" class="b-amt" style="width:60px"></td>
        <td><input type="text" class="b-note" placeholder="Remark" style="width:100%;padding:4px"></td>
        <td><button onclick="this.parentElement.parentElement.remove()" style="background:none">❌</button></td>
    `;
    $('bulkBody').appendChild(tr);
}

// --- SECURITY & UTILS ---
function secureReset() {
    const pwd = prompt("Enter PIN to continue:");
    if(pwd === RESET_PWD) {
        if(confirm("Confirm Wipe All Data?")) {
            localStorage.clear();
            state.entries = [];
            githubPush();
            location.reload();
        }
    } else {
        alert("Wrong Password!");
    }
}
function toggleCustomRange() { $('customPicker').style.display = $('timeFilter').value === 'custom' ? 'block' : 'none'; }
function openBulkModal(uid = null) { activeUserId = uid; $('bulkBody').innerHTML = ''; for(let i=0; i<5; i++) addBulkRow(); window.history.pushState({modal: 'bulk'}, "", "#bulk"); $('bulkModal').classList.add('show'); }
function openEntryModal() { window.history.pushState({modal: 'entry'}, "", "#entry"); $('entryModal').classList.add('show'); }
function setTheme(t) { document.body.className = t === 'light' ? '' : 'theme-' + t; localStorage.setItem('pg_theme', t); }
function fillSelects() {
    $('eUser').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    $('eCat').innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
}
function renderAll() { renderDashboard(); fillSelects(); renderTransactions(); renderCategories(); if(activeUserId) renderUserDetail(activeUserId); }
function addCategory() { const n = prompt('Name?'); if(n) { state.categories.push(n); renderAll(); githubPush(); } }
function deleteCat(n) { if(confirm('Del?')) { state.categories = state.categories.filter(c => c !== n); renderAll(); githubPush(); } }
function renderCategories() { $('catList').innerHTML = state.categories.map(c => `<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid var(--line);font-size:12px"><span>${c}</span><button onclick="deleteCat('${c}')" style="color:red;background:none">Del</button></div>`).join(''); }
function deleteTx(id) { if(confirm('Del?')) { state.entries = state.entries.filter(e => e.id !== id); renderAll(); githubPush(); } }

// Start
const local = localStorage.getItem(KEY);
if(local) state = JSON.parse(local);
setTheme(localStorage.getItem('pg_theme') || 'light');
githubPull();
setInterval(() => githubPull(true), 15000);
window.history.replaceState({page: 'dashboard'}, "", "#dashboard");
renderPage('dashboard');
</script>
</body>
